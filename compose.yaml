# Environnement de démonstration : PostgreSQL, Keycloak et l'application (profil « demo »).
#
#   cp .env.example .env            # puis renseigner les mots de passe
#   ./mvnw -DskipTests package
#   (cd frontend && npm ci && npm run build)
#   docker compose up -d --build
#
# Application : http://localhost:3000
# Swagger UI : http://localhost:8080/swagger-ui.html (bouton « Authorize », client sarf-swagger)
# Keycloak   : http://localhost:8180 (console d'administration : admin / KEYCLOAK_ADMIN_PASSWORD)

name: sarf

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: sarf
      POSTGRES_USER: sarf
      POSTGRES_PASSWORD: ${SARF_DB_PASSWORD:?Renseignez SARF_DB_PASSWORD dans .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sarf -d sarf"]
      interval: 5s
      retries: 20
    mem_limit: 256m

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Renseignez KEYCLOAK_ADMIN_PASSWORD dans .env}
      # Les navigateurs voient Keycloak sur localhost:8180 ; l'application le joint par le réseau Docker.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      SARF_DEMO_PASSWORD: ${SARF_DEMO_PASSWORD:?Renseignez SARF_DEMO_PASSWORD dans .env}
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=65
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8180:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      retries: 30
    mem_limit: 768m

  sarf:
    build: .
    image: sarf:local
    environment:
      SPRING_PROFILES_ACTIVE: demo
      SARF_DB_URL: jdbc:postgresql://postgres:5432/sarf
      SARF_DB_USER: sarf
      SARF_DB_PASSWORD: ${SARF_DB_PASSWORD}
      # L'émetteur des jetons est l'adresse vue par le navigateur ; les clés sont lues par le réseau Docker.
      SARF_ISSUER_URI: http://localhost:8180/realms/sarf
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/sarf/protocol/openid-connect/certs
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      retries: 30
    mem_limit: 512m

  web:
    build: ./frontend
    image: sarf-web:local
    ports:
      - "3000:8080"
    depends_on:
      sarf:
        condition: service_healthy
    mem_limit: 64m

volumes:
  postgres-data:
